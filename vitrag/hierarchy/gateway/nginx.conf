# Gateway for the hierarchy lab. State-dependent blocking comes from /control/gateway_http.conf, which the
# controller regenerates from /control/state.json and applies with a reload (SIGHUP).
worker_processes 1;
events { worker_connections 512; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;           # docker DNS; upstreams are resolved per request (variables below)
    include /control/gateway_http.conf;              # defines $acd_blocked, $acd_rl_key and the limit_req zone
    limit_req_status 429;

    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" "$request_body" rid=$request_id';
    access_log /var/log/acd/nginx/access.log detailed;
    error_log  /var/log/acd/nginx/error.log warn;

    server {
        listen 80 default_server;

        if ($acd_blocked) {
            add_header X-ACD-Blocked $acd_blocked always;
            add_header X-ACD-Service nginx always;
            add_header X-Request-ID $request_id always;
            return 503;
        }

        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header X-ACD-Blocked "mode=rate_limited; capability=bulk_requests" always;
            add_header X-ACD-Service nginx always;
            return 429;
        }

        location = /healthz { default_type application/json; return 200 '{"status":"ok","service":"nginx"}'; }

        location ~ ^/auth(/|$)   { set $up http://auth_api:5000;    include /etc/nginx/proxy_common.conf; proxy_pass $up; }
        location ~ ^/api(/|$)    { set $up http://product_api:5001; include /etc/nginx/proxy_common.conf; proxy_pass $up; }
        location ~ ^/orders(/|$) { set $up http://order_api:5002;   include /etc/nginx/proxy_common.conf; proxy_pass $up; }
        location ~ ^/search(/|$) { set $up http://search_api:5003;  include /etc/nginx/proxy_common.conf; proxy_pass $up; }

        location / { default_type text/html; return 200 '<html><body><h1>ACD Hierarchy Gateway</h1></body></html>'; }
    }
}
